services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: autorepair
      POSTGRES_USER: autorepair
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autorepair}
    volumes:
      # SQL files in this folder run once, when the database is created for the first time
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorepair -d autorepair"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://autorepair:${DB_PASSWORD:-autorepair}@db:5432/autorepair
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"

volumes:
  pgdata:
